{% extends "base.html" %}

{% block content %}

<section class="card">
    <h2>Simulation</h2>
    <p id="status-text">Loading scenario...</p>
</section>

<div style="text-align:center; margin:12px 0;">
    <button id="start-btn" disabled style="padding:10px 24px; font-size:14px; margin-right:8px;">PLAY</button>
    <button id="stop-btn" disabled style="padding:10px 24px; font-size:14px; margin-right:8px;">PAUSE</button>
    <button id="restart-btn" disabled style="padding:10px 24px; font-size:14px; margin-right:8px;">RESTART</button>
    <button id="back-btn"  style="padding:10px 24px; font-size:14px; background:#e8eef8; border:2px solid #1e3c78; margin-right:24px;">BACK TO BUILDER</button>

    <label for="speed-dial" style="font-weight:bold;">Speed:</label>
    <input type="range" id="speed-dial" min="0.25" max="5" step="0.25" value="1" style="width:200px; vertical-align:middle;">
    <span id="speed-label" style="min-width:50px; font-weight:bold; display:inline-block;">1.00x</span>
</div>

<div style="max-width:900px; margin:16px auto; padding:0 16px;">
    <label for="timeline" style="font-weight:bold;">Playback position</label>
    <input id="timeline" type="range" min="0" max="0" step="any" value="0" disabled
           aria-describedby="timeline-help" style="display:block; width:100%; margin:8px 0;">
    <output id="timeline-label" for="timeline">0.00 / 0.00 min</output>
    <span id="timeline-help" style="display:block; margin-top:4px;">Drag to review any moment. Playback pauses; press PLAY to continue.</span>
</div>

<div id="canvas-controls" class="canvas-controls">
    <button type="button" data-zoom-out aria-label="Zoom out">−</button>
    <span data-zoom-label>100%</span>
    <button type="button" data-zoom-in aria-label="Zoom in">+</button>
    <button type="button" data-zoom-reset>Reset view</button>
    <span>Scroll to zoom · Shift + drag or middle mouse to pan</span>
</div>
<canvas id="sim-canvas" width="2400" height="1042"
        data-part-image-url="{{ url_for('static', filename='images/Part.png') }}"
        data-line-direction-image-url="{{ url_for('static', filename='images/line_direction.png') }}"
        style="border:1px solid #ccc; background:#ffffff; display:block;
               margin:20px auto; max-width:100%;">
</canvas>
<div id="station-tooltip" class="station-tooltip" role="tooltip" hidden></div>




{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/playback.js') }}"></script>
{% endblock %}
